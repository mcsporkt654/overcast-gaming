<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>News Item — Overcast Gaming</title>
  <meta name="description" content="Detailed community dispatch from Overcast Gaming." />
  <link rel="stylesheet" href="style.css" />
  <script src="news-data.js" defer></script>
  <script src="nav.js" defer></script>
  <style>
    .news-shell {
      max-width: 980px;
      margin: 0 auto;
      padding: 2.5rem var(--gutter) 3rem;
    }
    .news-back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1.2rem;
    }
    .news-back:hover { color: var(--accent); }
    .news-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .news-image {
      width: 100%;
      height: clamp(220px, 36vw, 380px);
      object-fit: cover;
      display: block;
      border-bottom: 1px solid var(--border);
    }
    .news-content {
      padding: 1.6rem 1.8rem 2rem;
    }
    .news-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 0.85rem;
    }
    .news-badge {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      border: 1px solid rgba(78,205,196,0.32);
      background: rgba(78,205,196,0.1);
      border-radius: 3px;
      padding: 0.18rem 0.45rem;
      font-weight: 600;
    }
    .news-byline {
      color: var(--text-muted);
      font-size: 0.78rem;
      letter-spacing: 0.06em;
    }
    .news-title {
      font-size: clamp(1.35rem, 3vw, 2rem);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-primary);
      margin-bottom: 0.8rem;
    }
    .news-dek {
      color: var(--text-secondary);
      margin-bottom: 1rem;
      line-height: 1.7;
      font-size: 0.96rem;
    }
    .news-divider {
      height: 1px;
      background: linear-gradient(to right, var(--border), transparent);
      margin: 1rem 0 1.2rem;
    }
    .news-body {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      color: var(--text-secondary);
      line-height: 1.75;
      font-size: 0.95rem;
    }
    .news-highlights {
      margin-top: 1.1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(78,205,196,0.04);
      padding: 1rem 1rem 0.9rem;
    }
    .news-highlights h3 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      margin-bottom: 0.7rem;
    }
    .news-highlights ul {
      padding-left: 1.15rem;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 0.1rem;
    }
    .news-gallery {
      margin-top: 1.3rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.75rem;
    }
    .news-gallery img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    .news-empty {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .news-related {
      margin-top: 1.25rem;
    }
    .news-related h3 {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }
    .news-related-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.7rem;
    }
    .news-related-link {
      display: block;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.75rem;
      background: rgba(78,205,196,0.03);
      transition: border-color 0.2s, transform 0.2s;
    }
    .news-related-link:hover {
      border-color: var(--border-glow);
      transform: translateY(-1px);
    }
    .news-related-link strong {
      display: block;
      color: var(--text-primary);
      font-size: 0.84rem;
      line-height: 1.45;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.45rem;
    }
    .news-related-link span {
      color: var(--text-muted);
      font-size: 0.72rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <span class="skull">☠</span> Overcast Gaming
      </a>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/feed" class="active">Community</a></li>
        <li><a href="/gallery">Gallery</a></li>
        <li><a href="/roster">Roster</a></li>
        <li><a href="/owl">The OWL</a></li>
        <li><a href="/stats">Stats</a></li>
        <li><a href="https://arma.gg/collections/overcast" target="_blank" rel="noopener">Merch</a></li>
        <li><a href="/admin">Admin</a></li>
      </ul>
    </div>
  </nav>

  <main class="news-shell" id="news-root">
    <div class="news-empty">Loading dispatch...</div>
  </main>

  <footer>
    <p>Overcast Gaming <span class="skull-divider">☠</span> Portland, Oregon <span class="skull-divider">☠</span> Warhammer 40,000 League</p>
    <p style="margin-top:0.5rem; font-size:0.7rem; color: var(--text-muted);">Not affiliated with Games Workshop. Warhammer 40,000 © Games Workshop Ltd.</p>
  </footer>

  <script>
    function formatDate(dateStr) {
      const d = new Date(dateStr + 'T12:00:00');
      return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    }

    function getQuerySlug() {
      const params = new URLSearchParams(window.location.search);
      return params.get('slug') || '';
    }

    function slugToHref(slug) {
      return `/news?slug=${encodeURIComponent(slug)}`;
    }

    function getRelatedItems(currentItem, allItems) {
      return allItems
        .filter(entry => entry.slug !== currentItem.slug)
        .sort((a, b) => {
          const categoryWeightA = a.category === currentItem.category ? 1 : 0;
          const categoryWeightB = b.category === currentItem.category ? 1 : 0;
          if (categoryWeightA !== categoryWeightB) return categoryWeightB - categoryWeightA;
          return new Date(b.date) - new Date(a.date);
        })
        .slice(0, 3);
    }

    function renderNotFound(root) {
      root.textContent = '';
      const empty = document.createElement('div');
      empty.className = 'news-empty';
      empty.textContent = 'Dispatch not found. Return to Community Feed for available reports.';
      root.appendChild(empty);
    }

    function renderArticle(root, item, allItems) {
      root.textContent = '';

      const back = document.createElement('a');
      back.className = 'news-back';
      back.href = '/feed';
      back.textContent = '← Back to Community Feed';
      root.appendChild(back);

      const card = document.createElement('article');
      card.className = 'news-card';

      const image = document.createElement('img');
      image.className = 'news-image';
      image.src = item.image;
      image.alt = `${item.title} feature image`;
      card.appendChild(image);

      const content = document.createElement('div');
      content.className = 'news-content';

      const meta = document.createElement('div');
      meta.className = 'news-meta';

      const badge = document.createElement('span');
      badge.className = 'news-badge';
      badge.textContent = item.category;

      const byline = document.createElement('span');
      byline.className = 'news-byline';
      byline.textContent = `${formatDate(item.date)} • ${item.author} • ${item.readTime}`;

      meta.appendChild(badge);
      meta.appendChild(byline);

      const title = document.createElement('h1');
      title.className = 'news-title';
      title.textContent = item.title;

      const dek = document.createElement('p');
      dek.className = 'news-dek';
      dek.textContent = item.excerpt;

      const divider = document.createElement('div');
      divider.className = 'news-divider';

      const body = document.createElement('div');
      body.className = 'news-body';
      item.body.forEach(paragraph => {
        const p = document.createElement('p');
        p.textContent = paragraph;
        body.appendChild(p);
      });

      content.appendChild(meta);
      content.appendChild(title);
      content.appendChild(dek);
      content.appendChild(divider);
      content.appendChild(body);

      if (item.highlights && item.highlights.length) {
        const hl = document.createElement('section');
        hl.className = 'news-highlights';
        const h3 = document.createElement('h3');
        h3.textContent = 'Field Notes';
        const ul = document.createElement('ul');
        item.highlights.forEach(point => {
          const li = document.createElement('li');
          li.textContent = point;
          ul.appendChild(li);
        });
        hl.appendChild(h3);
        hl.appendChild(ul);
        content.appendChild(hl);
      }

      if (item.gallery && item.gallery.length) {
        const gallery = document.createElement('div');
        gallery.className = 'news-gallery';
        item.gallery.forEach(url => {
          const img = document.createElement('img');
          img.src = url;
          img.alt = `${item.title} gallery image`;
          gallery.appendChild(img);
        });
        content.appendChild(gallery);
      }

      const relatedItems = getRelatedItems(item, allItems);
      if (relatedItems.length) {
        const related = document.createElement('section');
        related.className = 'news-related';
        const heading = document.createElement('h3');
        heading.textContent = 'Related Dispatches';
        const grid = document.createElement('div');
        grid.className = 'news-related-grid';

        relatedItems.forEach(entry => {
          const link = document.createElement('a');
          link.className = 'news-related-link';
          link.href = slugToHref(entry.slug);

          const strong = document.createElement('strong');
          strong.textContent = entry.title;

          const meta = document.createElement('span');
          meta.textContent = `${entry.category} • ${formatDate(entry.date)}`;

          link.appendChild(strong);
          link.appendChild(meta);
          grid.appendChild(link);
        });

        related.appendChild(heading);
        related.appendChild(grid);
        content.appendChild(related);
      }

      card.appendChild(content);
      root.appendChild(card);
      document.title = `${item.title} — Overcast Gaming`;
    }

    const root = document.getElementById('news-root');
    const items = Array.isArray(window.OVERCAST_NEWS_ITEMS) ? window.OVERCAST_NEWS_ITEMS : [];
    const slug = getQuerySlug();
    const item = items.find(entry => entry.slug === slug);

    if (!item) renderNotFound(root);
    else renderArticle(root, item, items);
  </script>

</body>
</html>
