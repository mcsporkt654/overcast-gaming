<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roster — Overcast Gaming</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="/" class="nav-logo"><span class="skull">☠</span> Overcast Gaming</a>
      <ul class="nav-links" id="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/roster" class="active">Roster</a></li>
        <li><a href="/stats">Match Stats</a></li>
        <li><a href="/community">Community</a></li>
        <li><a href="/admin">Admin</a></li>
      </ul>
      <button class="nav-hamburger" id="nav-hamburger" aria-label="Toggle menu" aria-expanded="false">&#9776;</button>
    </div>
  </nav>

  <div style="background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 2.5rem var(--gutter) 2rem;">
    <div style="max-width:1200px; margin:0 auto;">
      <p style="font-size:0.7rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--text-muted); margin-bottom:0.4rem;">Portland, Oregon</p>
      <h1 style="font-size:2rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-primary);">
        The <span style="color:var(--accent)">Roster</span>
      </h1>
      <p style="color:var(--text-muted); font-size:0.9rem; margin-top:0.4rem;">The commanders of Overcast Gaming and the factions they command.</p>
    </div>
  </div>

  <section class="section">
    <div id="roster-grid" class="roster-grid">
      <div class="loader">Summoning warriors...</div>
    </div>
  </section>

  <footer>
    <p>Overcast Gaming <span class="skull-divider">☠</span> Portland, Oregon <span class="skull-divider">☠</span> Warhammer 40,000 League</p>
  </footer>

  <script>
    document.getElementById('nav-hamburger').addEventListener('click', function() {
      const links = document.getElementById('nav-links');
      const open = links.classList.toggle('open');
      this.setAttribute('aria-expanded', open);
      this.textContent = open ? '✕' : '☰';
    });

    fetch('/api/players')
      .then(r => r.json())
      .then(players => {
        const grid = document.getElementById('roster-grid');
        if (!players.length) {
          grid.innerHTML = '<p class="no-data">No players found. Add one via the Admin panel.</p>';
          return;
        }
        grid.innerHTML = players.map(p => {
          const avatarHTML = p.photo
            ? `<img src="${p.photo}" alt="${p.name}" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid var(--border-glow);margin:0 auto 1rem;display:block;" onerror="this.parentElement.innerHTML='<div class=\\'player-avatar-placeholder\\'>☠</div>'">`
            : `<div class="player-avatar-placeholder">☠</div>`;
          const armyTags = p.armies.map(a => `<span class="army-tag">${a}</span>`).join('');
          let winRateHTML = '';
          if (p.total > 0) {
            winRateHTML = `
              <div style="margin-top:0.75rem; padding-top:0.75rem; border-top:1px solid var(--border)">
                <span class="player-win-rate">${p.winRate}%</span>
                <span class="player-win-label">Win Rate</span>
                <p class="player-wld">
                  <span class="w">W ${p.wins}</span> &bull;
                  <span class="l">L ${p.losses}</span> &bull;
                  <span class="d">D ${p.draws}</span> &nbsp;(${p.total} games)
                </p>
              </div>`;
          } else {
            winRateHTML = `
              <div style="margin-top:0.75rem; padding-top:0.75rem; border-top:1px solid var(--border)">
                <span style="font-size:0.75rem; color:var(--text-muted)">No games recorded</span>
              </div>`;
          }
          const socials = p.socials || {};
          const socialDefs = {
            instagram: { label: 'Instagram', color: '#E1306C', svg: '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>' },
            twitter: { label: 'X / Twitter', color: '#1DA1F2', svg: '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.748l7.73-8.835L1.254 2.25H8.08l4.253 5.622 5.91-5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>' },
            discord: { label: 'Discord', color: '#5865F2', svg: '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128 10.2 10.2 0 00.372-.292.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03z"/></svg>' }
          };
          const socialButtons = Object.entries(socialDefs)
            .filter(([key]) => socials[key])
            .map(([key, def]) => {
              const url = socials[key].startsWith('http') ? socials[key] : `https://${socials[key]}`;
              return `<a href="${url}" target="_blank" rel="noopener" title="${def.label}" style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;background:rgba(255,255,255,0.06);border:1px solid var(--border);color:${def.color};text-decoration:none;">${def.svg}</a>`;
            }).join('');
          const socialsHTML = socialButtons
            ? `<div style="margin-top:0.75rem;padding-top:0.75rem;border-top:1px solid var(--border);display:flex;gap:6px;justify-content:center;flex-wrap:wrap;">${socialButtons}</div>`
            : '';
          return `<div class="player-card">
            ${avatarHTML}
            <div class="player-name">${p.name}</div>
            <div class="army-tags">${armyTags || '<span class="army-tag" style="color:var(--text-muted)">Unaligned</span>'}</div>
            ${winRateHTML}
            ${socialsHTML}
          </div>`;
        }).join('');
      })
      .catch(() => {
        document.getElementById('roster-grid').innerHTML = '<p class="no-data">Could not load roster data.</p>';
      });
  </script>
</body>
</html>
