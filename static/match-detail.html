<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Match Detail — Overcast Wargaming League</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="/favicon.svg" />
  <script src="nav.js" defer></script>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <img class="nav-mark" src="/owl-mark.png" alt="" width="34" height="34" />Overcast
      </a>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/feed">Community</a></li>
        <li><a href="/gallery">Gallery</a></li>
        <li><a href="/roster">Roster</a></li>
        <li><a href="/owl">The OWL</a></li>
        <li><a href="/stats" class="active">Stats</a></li>
        <li><a href="https://arma.gg/collections/overcast" target="_blank" rel="noopener">Merch</a></li>
        <li><a href="/admin">Admin</a></li>
      </ul>
    </div>
  </nav>

  <div style="background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 2.5rem var(--gutter) 2rem;">
    <div style="max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap; align-items:flex-end;">
      <div>
        <p style="font-size:0.7rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--text-muted); margin-bottom:0.4rem;">The Annals of War</p>
        <h1 style="font-size:2rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-primary);">
          Match <span style="color:var(--accent)">Detail</span>
        </h1>
        <p id="subtitle" style="color:var(--text-muted); font-size:0.9rem; margin-top:0.4rem;">Loading full battle record...</p>
      </div>
      <div style="display:flex; gap:0.6rem; flex-wrap:wrap;">
        <a class="btn btn-outline" href="/stats" style="font-size:0.72rem;">Back to Stats</a>
        <a class="btn btn-outline" href="/matchups" style="font-size:0.72rem;">Matchups</a>
        <a class="btn btn-outline" href="/meta" style="font-size:0.72rem;">Meta Trends</a>
      </div>
    </div>
  </div>

  <section class="section">
    <div id="content"><div class="loader">Loading match detail...</div></div>
  </section>

  <footer>
    <p>Overcast Wargaming League <span class="skull-divider">☠</span> Portland, Oregon <span class="skull-divider">☠</span> Warhammer 40,000 League</p>
  </footer>

  <script>
    function toDate(value) {
      if (!value) return 'Unknown date';
      return new Date(value + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function toScore(value) {
      return value == null ? '—' : String(value);
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function formatUnit(unit) {
      if (!unit || !unit.unitName) return '';
      const count = unit.count && unit.count > 1 ? `${unit.count}x ` : '';
      const role = unit.role ? ` (${unit.role})` : '';
      const points = unit.points == null ? '' : ` — ${unit.points} pts`;
      return escapeHtml(`${count}${unit.unitName}${role}${points}`);
    }

    async function loadMatch() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const subtitle = document.getElementById('subtitle');
      const content = document.getElementById('content');

      if (!id) {
        subtitle.textContent = 'Missing match id in URL.';
        content.innerHTML = '<p class="no-data">No match id supplied. Open this page from the Stats battle log.</p>';
        return;
      }

      try {
        const res = await fetch(`/api/matches/${encodeURIComponent(id)}`);
        if (!res.ok) {
          throw new Error(res.status === 404 ? 'Match not found.' : 'Failed to load match.');
        }

        const m = await res.json();
        subtitle.textContent = `${toDate(m.date)} • ${m.playerName} vs ${m.opponentName}`;

        const playerName = escapeHtml(m.playerName || 'Unknown player');
        const opponentName = escapeHtml(m.opponentName || 'Unknown opponent');
        const armyUsed = escapeHtml(m.armyUsed || '—');
        const armySubfaction = escapeHtml(m.armySubfaction || '—');
        const opponentArmy = escapeHtml(m.opponentArmy || '—');
        const opponentSubfaction = escapeHtml(m.opponentSubfaction || '—');
        const missionName = escapeHtml(m.missionName || 'Mission not set');
        const eventName = escapeHtml(m.eventName || 'No event grouping');
        const battleNotes = escapeHtml(m.battleNotes || 'No notes recorded for this battle.');

        const matchupParams = new URLSearchParams();
        if (m.armyUsed) matchupParams.set('army', m.armyUsed);
        if (m.opponentArmy) matchupParams.set('opponent', m.opponentArmy);
        matchupParams.set('fromMatch', id);

        const playerMetaParams = new URLSearchParams();
        if (m.armyUsed) playerMetaParams.set('army', m.armyUsed);
        playerMetaParams.set('fromMatch', id);

        const opponentMetaParams = new URLSearchParams();
        if (m.opponentArmy) opponentMetaParams.set('army', m.opponentArmy);
        opponentMetaParams.set('fromMatch', id);

        const matchupHref = `/matchups${matchupParams.toString() ? `?${matchupParams.toString()}` : ''}`;
        const playerMetaHref = `/meta${playerMetaParams.toString() ? `?${playerMetaParams.toString()}` : ''}`;
        const opponentMetaHref = `/meta${opponentMetaParams.toString() ? `?${opponentMetaParams.toString()}` : ''}`;
        const playerProfileHref = m.playerId ? `/player?id=${encodeURIComponent(m.playerId)}` : '/stats';

        const playerUnits = Array.isArray(m.playerUnits) && m.playerUnits.length
          ? m.playerUnits.map(u => `<li>${formatUnit(u)}</li>`).join('')
          : '<li>No key units recorded.</li>';

        const oppUnits = Array.isArray(m.opponentUnits) && m.opponentUnits.length
          ? m.opponentUnits.map(u => `<li>${formatUnit(u)}</li>`).join('')
          : '<li>No key units recorded.</li>';

        content.innerHTML = `
          <div class="summary-grid" style="margin-bottom:1.5rem;">
            <div class="summary-card">
              <h3>Result</h3>
              <p style="font-size:2rem; font-family:var(--font-gothic); color:var(--accent);">${m.result || '—'}</p>
              <p style="font-size:0.8rem; color:var(--text-muted);">Points Diff: ${m.pointsDiff == null ? '—' : m.pointsDiff}</p>
            </div>
            <div class="summary-card">
              <h3>Mission and Event</h3>
              <p style="font-size:0.95rem; color:var(--text-primary); margin-bottom:0.35rem;">${missionName}</p>
              <p style="font-size:0.8rem; color:var(--text-muted);">${eventName}</p>
            </div>
          </div>

          <div class="summary-card" style="margin-bottom:1.5rem;">
            <h3>Focused Analytics</h3>
            <div style="display:flex; gap:0.6rem; flex-wrap:wrap;">
              <a class="btn btn-outline" href="${playerProfileHref}" style="font-size:0.72rem;">${playerName} Profile</a>
              <a class="btn btn-outline" href="${matchupHref}" style="font-size:0.72rem;">${armyUsed} vs ${opponentArmy}</a>
              <a class="btn btn-outline" href="${playerMetaHref}" style="font-size:0.72rem;">${armyUsed} Meta</a>
              <a class="btn btn-outline" href="${opponentMetaHref}" style="font-size:0.72rem;">${opponentArmy} Meta</a>
            </div>
          </div>

          <div class="summary-grid" style="margin-bottom:1.5rem;">
            <div class="summary-card">
              <h3>${playerName}</h3>
              <p style="font-size:0.9rem; color:var(--text-secondary); margin-bottom:0.35rem;">Faction: <span style="color:var(--text-primary)">${armyUsed}</span></p>
              <p style="font-size:0.9rem; color:var(--text-secondary); margin-bottom:0.35rem;">Subfaction: <span style="color:var(--text-primary)">${armySubfaction}</span></p>
              <p style="font-size:0.9rem; color:var(--text-secondary);">Points: <span style="color:var(--text-primary)">${m.armyPoints == null ? '—' : m.armyPoints}</span></p>
              <div style="margin-top:0.9rem;">
                <p style="font-size:0.72rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-muted); margin-bottom:0.4rem;">Key Units</p>
                <ul style="padding-left:1.15rem; color:var(--text-secondary);">${playerUnits}</ul>
              </div>
            </div>

            <div class="summary-card">
              <h3>${opponentName}</h3>
              <p style="font-size:0.9rem; color:var(--text-secondary); margin-bottom:0.35rem;">Faction: <span style="color:var(--text-primary)">${opponentArmy}</span></p>
              <p style="font-size:0.9rem; color:var(--text-secondary); margin-bottom:0.35rem;">Subfaction: <span style="color:var(--text-primary)">${opponentSubfaction}</span></p>
              <p style="font-size:0.9rem; color:var(--text-secondary);">Points: <span style="color:var(--text-primary)">${m.opponentPoints == null ? '—' : m.opponentPoints}</span></p>
              <div style="margin-top:0.9rem;">
                <p style="font-size:0.72rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-muted); margin-bottom:0.4rem;">Key Units</p>
                <ul style="padding-left:1.15rem; color:var(--text-secondary);">${oppUnits}</ul>
              </div>
            </div>
          </div>

          <div class="summary-card" style="margin-bottom:1.5rem;">
            <h3>Objective Breakdown</h3>
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>Track</th>
                    <th>${playerName}</th>
                    <th>${opponentName}</th>
                  </tr>
                </thead>
                <tbody>
                  <tr><td>Primary</td><td>${toScore(m.primaryScorePlayer)}</td><td>${toScore(m.primaryScoreOpponent)}</td></tr>
                  <tr><td>Secondary</td><td>${toScore(m.secondaryScorePlayer)}</td><td>${toScore(m.secondaryScoreOpponent)}</td></tr>
                  <tr><td>Destruction</td><td>${toScore(m.destructionScorePlayer)}</td><td>${toScore(m.destructionScoreOpponent)}</td></tr>
                </tbody>
              </table>
            </div>
          </div>

          <div class="summary-card">
            <h3>Battle Notes</h3>
            <p style="color:var(--text-secondary); white-space:pre-wrap;">${battleNotes}</p>
          </div>
        `;
      } catch (error) {
        subtitle.textContent = 'Unable to load match detail.';
        content.innerHTML = `<p class="no-data">${error.message}</p>`;
      }
    }

    loadMatch();
  </script>
</body>
</html>
